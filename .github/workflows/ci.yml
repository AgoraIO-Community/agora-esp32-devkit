name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install formatting tools
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Format check
        run: |
          find main components/mybot_platform tests/atom_echos3r \
            tests/st7789_lifecycle tests/co5300_lifecycle tests/bread_compact_wifi_lcd \
            tests/cst816s_input tests/tca9554 tests/cores3_pixel_ui -type f \
            \( -name '*.c' -o -name '*.h' -o -name '*.cc' -o -name '*.cpp' \) \
            -exec clang-format --dry-run --Werror {} +
      - name: Whitespace check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1..HEAD"
            else
              range="$before..${{ github.event.after }}"
            fi
          fi
          git diff --check "$range"
      - name: SPDX check
        run: |
          find main components/mybot_platform tests/atom_echos3r \
            tests/st7789_lifecycle tests/co5300_lifecycle tests/bread_compact_wifi_lcd \
            tests/cst816s_input tests/tca9554 tests/cores3_pixel_ui -type f \
            \( -name '*.c' -o -name '*.h' -o -name '*.cc' -o -name '*.cpp' \) \
            -print0 | while IFS= read -r -d '' file; do
              head -n 5 "$file" | grep -q 'SPDX-License-Identifier:' || {
                echo "missing SPDX header: $file" >&2
                exit 1
              }
            done
      - name: AtomEchoS3R host lifecycle tests
        run: sh tests/atom_echos3r/run.sh
      - name: ST7789 and Xingzhi Cube host lifecycle tests
        run: sh tests/st7789_lifecycle/run.sh
      - name: CO5300 host lifecycle tests
        run: sh tests/co5300_lifecycle/run.sh
      - name: CST816S and Boot input host lifecycle tests
        run: sh tests/cst816s_input/run.sh
      - name: TCA9554 masked update host tests
        run: sh tests/tca9554/run.sh
      - name: Bread Compact Wi-Fi LCD host lifecycle tests
        run: sh tests/bread_compact_wifi_lcd/run.sh
      - name: CoreS3 pixel UI host lifecycle tests
        run: sh tests/cores3_pixel_ui/run.sh
      - name: Build output cleanup safety tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/build_all -p 'test_*.py' -v
      - name: Validate commit messages
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            if [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1..HEAD"
            else
              range="$before..${{ github.event.after }}"
            fi
          fi
          git log --no-merges --format='%s' "$range" | while IFS= read -r subject; do
            printf '%s\n' "$subject" | ./githooks/commit-msg --subject-only >/dev/null
          done

  idf-build:
    name: idf-5.5.2-${{ matrix.board }}-${{ matrix.language }}-ptime-${{ matrix.ptime }}-video-${{ matrix.video || 'off' }}-ui-${{ matrix.ui || 'default' }}
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v5.5.2
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: zhengchen-1.54tft-ml307
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: zhengchen-1.54tft-ml307
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: zhengchen-1.54tft-wifi
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: zhengchen-1.54tft-wifi
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: xingzhi-cube-1.54tft-wifi
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: xingzhi-cube-1.54tft-wifi
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: bread-compact-wifi-lcd
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: bread-compact-wifi-lcd
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: esp-vocat
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: esp-vocat
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: esp32-s3-touch-amoled-1.75
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: esp32-s3-touch-amoled-1.75
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: esp32-s3-touch-amoled-1.75c
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: esp32-s3-touch-amoled-1.75c
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: esp32-s3-touch-amoled-2.16
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: esp32-s3-touch-amoled-2.16
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: esp32-s3-touch-amoled-1.8-v2
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: esp32-s3-touch-amoled-1.8-v2
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: esp32-s3-touch-lcd-1.85
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: esp32-s3-touch-lcd-1.85
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: genjutech-s3-1.54tft
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: genjutech-s3-1.54tft
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: m5stack-core-s3
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: m5stack-core-s3
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: m5stack-core-s3
            language: zh-CN
            ptime: 60
            video: jpeg-1fps
            defaults: ci/ptime60.defaults;ci/video.defaults
          - board: m5stack-core-s3
            language: en-US
            ptime: 60
            video: jpeg-1fps
            defaults: ci/ptime60.defaults;ci/en-us.defaults;ci/video.defaults
          - board: m5stack-stick-s3
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: m5stack-stick-s3
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: atom-echos3r
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: atom-echos3r
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: respeaker-flex-xvf3800-circular4-xiao
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: respeaker-flex-xvf3800-circular4-xiao
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: sensecap-watcher
            language: zh-CN
            ptime: 60
            defaults: ci/ptime60.defaults
          - board: sensecap-watcher
            language: en-US
            ptime: 60
            defaults: ci/ptime60.defaults;ci/en-us.defaults
          - board: m5stack-core-s3
            language: en-US
            ptime: 60
            ui: lvgl-light
            defaults: ci/ptime60.defaults;ci/lvgl-ui-light.defaults;ci/en-us.defaults
          - board: m5stack-core-s3
            language: zh-CN
            ptime: 60
            video: jpeg-1fps
            ui: lvgl-static
            defaults: ci/ptime60.defaults;ci/lvgl-ui-static.defaults;ci/video.defaults
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: |
          source /opt/esp/idf/export.sh >/dev/null
          test "$(idf.py --version)" = "ESP-IDF v5.5.2"
      - name: Build ESP32-S3 firmware
        run: |
          source /opt/esp/idf/export.sh >/dev/null
          idf.py -B build-${{ matrix.board }}-ptime-${{ matrix.ptime }}-ui-${{ matrix.ui || 'default' }}-lang-${{ matrix.language }}-video-${{ matrix.video || 'off' }} \
            -DMYBOT_BOARD=${{ matrix.board }} \
            -DSDKCONFIG=build-${{ matrix.board }}-ptime-${{ matrix.ptime }}-ui-${{ matrix.ui || 'default' }}-lang-${{ matrix.language }}-video-${{ matrix.video || 'off' }}/sdkconfig \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;${{ matrix.defaults }}" \
            build
      - name: Report size
        run: |
          source /opt/esp/idf/export.sh >/dev/null
          idf.py -B build-${{ matrix.board }}-ptime-${{ matrix.ptime }}-ui-${{ matrix.ui || 'default' }}-lang-${{ matrix.language }}-video-${{ matrix.video || 'off' }} size
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: mybot-esp32-${{ matrix.board }}-${{ matrix.language }}-ptime-${{ matrix.ptime }}-video-${{ matrix.video || 'off' }}-ui-${{ matrix.ui || 'default' }}-${{ github.sha }}
          path: |
            build-${{ matrix.board }}-ptime-${{ matrix.ptime }}-ui-${{ matrix.ui || 'default' }}-lang-${{ matrix.language }}-video-${{ matrix.video || 'off' }}/mybot_esp32.bin
            build-${{ matrix.board }}-ptime-${{ matrix.ptime }}-ui-${{ matrix.ui || 'default' }}-lang-${{ matrix.language }}-video-${{ matrix.video || 'off' }}/bootloader/bootloader.bin
            build-${{ matrix.board }}-ptime-${{ matrix.ptime }}-ui-${{ matrix.ui || 'default' }}-lang-${{ matrix.language }}-video-${{ matrix.video || 'off' }}/partition_table/partition-table.bin
            build-${{ matrix.board }}-ptime-${{ matrix.ptime }}-ui-${{ matrix.ui || 'default' }}-lang-${{ matrix.language }}-video-${{ matrix.video || 'off' }}/ota_data_initial.bin

  extended-idf-build:
    name: extended-${{ matrix.board }}-${{ matrix.language }}
    runs-on: ubuntu-24.04
    container:
      image: espressif/idf:v5.5.2
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: build-extended-${{ matrix.board }}-${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        board:
          - xingzhi-metal-1.54-wifi
          - xingzhi-cube-0.85tft-wifi
          - xingzhi-cube-0.96oled-wifi
          - xingzhi-abs-2.0
          - m5stack-stopwatch
          - esp32-s3-touch-amoled-1.8
          - esp32-s3-touch-amoled-1.32
          - esp32-s3-touch-amoled-1.43c
          - esp32-s3-touch-amoled-2.06
          - atoms3r-echo-base
          - atoms3r-echo-pyramid
          - sp-esp32-s3-1.28-box
          - esp-box
          - esp-box-3
          - esp-box-lite
          - esp32s3-korvo2-v3
          - lichuang-dev
          - quandong-s3-dev
          - rymcu-bigsmart
          - df-k10
          - mixgo-nova
          - taiji-pi-s3
          - freenove-esp32s3-display-2.8-lcd
          - esp32-s3-touch-lcd-1.54
          - esp32-s3-touch-lcd-1.83
          - esp32-s3-lcd-0.85
          - esp32-s3-touch-lcd-1.85b
          - esp32-s3-touch-lcd-1.85c
          - sp-esp32-s3-1.54-muma
          - atk-dnesp32s3-box0
          - nulllab-ai-vox-v3
          - aipi-lite
          - doit-s3-aibox
          - magiclick-2p4
          - movecall-cuican-esp32s3
          - movecall-moji-esp32s3
          - bread-compact-wifi
          - hu-087
          - kevin-sp-v4-dev
          - du-chatx
        language: [zh-CN, en-US]
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-S3 firmware
        run: |
          source /opt/esp/idf/export.sh >/dev/null
          defaults="ci/ptime60.defaults"
          if [ "${{ matrix.language }}" = "en-US" ]; then
            defaults="$defaults;ci/en-us.defaults"
          fi
          idf.py -B "$BUILD_DIR" \
            -DMYBOT_BOARD=${{ matrix.board }} \
            -DSDKCONFIG="$BUILD_DIR/sdkconfig" \
            -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;$defaults" \
            build
      - name: Report size
        run: |
          source /opt/esp/idf/export.sh >/dev/null
          idf.py -B "$BUILD_DIR" size
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: mybot-esp32-${{ matrix.board }}-${{ matrix.language }}-${{ github.sha }}
          path: |
            ${{ env.BUILD_DIR }}/mybot_esp32.bin
            ${{ env.BUILD_DIR }}/bootloader/bootloader.bin
            ${{ env.BUILD_DIR }}/partition_table/partition-table.bin
            ${{ env.BUILD_DIR }}/ota_data_initial.bin
